name: Build Android Debug APK
on:
  workflow_dispatch: # ✅支持手动点击按钮触发打包（最方便）
  push:
    branches: [ main ] # main分支推送代码自动打包

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-app  # 指定工作目录，进入安卓源码文件夹
    steps:
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装Android SDK环境
        uses: android-actions/setup-android@v3

      - name: 给gradlew增加执行权限
        run: chmod +x ./gradlew

      - name: 编译Debug APK
        run: ./gradlew assembleDebug

      - name: 上传APK作为产物Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaMai‑Debug‑APK
          path: app/build/outputs/apk/debug/*.apk
